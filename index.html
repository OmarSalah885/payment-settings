<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Payment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: url('images/background.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-logo {
      width: 56px;
      height: 38px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .visa-text {
      color: #fff;
      font-family: Arial Black, Arial, sans-serif;
      font-size: 15px;
      font-style: italic;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .btn-add {
      background-color: #00b050;
      border: none;
    }
    .btn-add:hover {
      background-color: #009a45;
      color: #fff;
    }
    .text-purple {
      color: #7f56d9 !important;
    }
    /* Legend-style floating labels on the border */
    .field-group {
      position: relative;
    }
    .field-group .form-control {
      border: 1px solid #ced4da;
      border-radius: 0.5rem;
      padding: 0.85rem 1rem;
      height: auto;
      font-size: 1rem;
    }
    .field-group .form-control:focus {
      border-color: #86b7fe;
      box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
    }
    .field-group .field-legend {
      position: absolute;
      top: -0.6rem;
      left: 0.85rem;
      background: #fff;
      padding: 0 0.4rem;
      font-size: 0.8rem;
      color: #6c757d;
      line-height: 1;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-7">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-5">

            <h1 class="h2 text-center fw-bold mb-1">Settings</h1>
            <p class="text-center fw-bold text-dark mb-4 fs-5">Payment</p>

            <!-- Saved cards -->
            <h5 class="fw-bold mb-3">Saved cards:</h5>

            <!-- Mastercard (black & white) -->
            <div class="d-flex align-items-center gap-3 mb-3">
              <div class="card-logo flex-shrink-0">
                <svg width="44" height="28" viewBox="0 0 48 30">
                  <circle cx="18" cy="15" r="12" fill="#fff"/>
                  <circle cx="30" cy="15" r="12" fill="#bbb"/>
                  <path d="M24 7.2c2.3 1.9 3.7 4.6 3.7 7.8s-1.4 5.9-3.7 7.8c-2.3-1.9-3.7-4.6-3.7-7.8s1.4-5.9 3.7-7.8z" fill="#888"/>
                </svg>
              </div>
              <div class="field-group flex-grow-1">
                <span class="field-legend">Card Number</span>
                <input type="text" class="form-control" value="**** **** **** 3193" readonly>
              </div>
              <a href="#" class="text-decoration-none text-purple fw-bold flex-shrink-0">Remove card</a>
            </div>

            <!-- Visa (black & white) -->
            <div class="d-flex align-items-center gap-3 mb-4">
              <div class="card-logo flex-shrink-0">
                <span class="visa-text">VISA</span>
              </div>
              <div class="field-group flex-grow-1">
                <span class="field-legend">Card Number</span>
                <input type="text" class="form-control" value="**** **** **** 4296" readonly>
              </div>
              <a href="#" class="text-decoration-none text-purple fw-bold flex-shrink-0">Remove card</a>
            </div>

            <!-- Add new card -->
            <h5 class="fw-bold mb-3">Add new card:</h5>

            <div class="field-group mb-3">
              <span class="field-legend">Cardholder's Name</span>
              <input type="text" class="form-control" placeholder="Omar Shilbaya">
            </div>

            <div class="row g-3 mb-4">
              <div class="col-6">
                <div class="field-group">
                  <span class="field-legend">Card Number</span>
                  <input type="text" class="form-control" placeholder="1234 5678 1234 5678">
                </div>
              </div>
              <div class="col-3">
                <div class="field-group">
                  <span class="field-legend">Expire</span>
                  <input type="text" class="form-control" placeholder="MM/YY">
                </div>
              </div>
              <div class="col-3">
                <div class="field-group">
                  <span class="field-legend">CVV</span>
                  <input type="text" class="form-control" placeholder="***">
                </div>
              </div>
            </div>

            <button type="button" class="btn btn-add btn-lg w-100 text-white fw-semibold text-uppercase py-3">
              ADD CARD
            </button>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
